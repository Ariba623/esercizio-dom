<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="container">
      <form>
        <div>
          <label>First Name:</label>
          <input type="text" class="form-input" id="firstName" value="Mario" />
        </div>
        <div>
          <label>Last Name:</label>
          <input type="text" class="form-input" id="lastName" value="Rossi" />
        </div>
        <div>
          <label>Age:</label>
          <input type="number" class="form-input" id="age" value="25" />
        </div>
      </form>
    </div>

    <script>
      // 1. recupero il valore di ciascun campo di input
      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const age = document.getElementById('age').value;

      // creo l'oggetto person
      const person = {
        firstName: firstName,
        lastName: lastName,
        age: Number(age), // .value restituisce sempre una stringa, la converto in numero
      };

      // 2. recupero il form e aggiungo l'attributo data-person con l'oggetto in formato JSON
      const form = document.querySelector('form');
      form.setAttribute('data-person', JSON.stringify(person));

      console.log(form.getAttribute('data-person'));
    </script>
  </body>
</html>
