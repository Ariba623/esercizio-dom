<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .form{
            display: flex;
            flex-direction: column;
            max-width: 300px;
            gap: 16px;
            margin-bottom: 16px
        };
    </style>
</head>
<body>
    <h1>Il form di <span class="title-name"></span></h1>
    <div class="form">
        <label for="email">Email</label>
        <input type="email" name="email" class="email" placeholder="email">
        <label for="firstname">Name</label>
        <input type="text" name="firstname" class="firstname" placeholder="firstname">
        <label for="lastname">Surname</label>
        <input type="text" name="lastname" class="lastname" placeholder="lastname">
    </div>
    <button class="btn">Salva</button>
    <p class="printedform"></p>
    <script>
        const inputEmail = document.querySelector('.email');
        const inputNome = document.querySelector('.firstname');
        const inputCognome = document.querySelector('.lastname');
        const titoloNome = document.querySelector('.title-name');
        const bottone = document.querySelector('.btn');
        const stampaForm = document.querySelector('.printedform');

        // mostra il nome nel titolo e tutti i dati nel paragrafo
        function mostraDati(dati) {
            titoloNome.textContent = dati.firstname;
            stampaForm.textContent = `Email: ${dati.email} - Nome: ${dati.firstname} - Cognome: ${dati.lastname}`;
        }

        // al click salvo tutti i dati del form nel local storage
        bottone.addEventListener('click', function () {
            const dati = {
                email: inputEmail.value,
                firstname: inputNome.value,
                lastname: inputCognome.value,
            };

            localStorage.setItem('datiForm', JSON.stringify(dati));
            mostraDati(dati);
        });

        // al reload recupero i dati salvati, così il nome nel titolo non scompare
        const datiSalvati = localStorage.getItem('datiForm');

        if (datiSalvati) {
            const dati = JSON.parse(datiSalvati);
            inputEmail.value = dati.email;
            inputNome.value = dati.firstname;
            inputCognome.value = dati.lastname;
            mostraDati(dati);
        }
    </script>
</body>

</html>
